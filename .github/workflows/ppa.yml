name: PPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  ppa:
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      matrix:
        series: [noble, resolute]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y devscripts debhelper dput gnupg
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          printf '%s' "$GPG_PASSPHRASE" > ~/.gnupg/passphrase
          chmod 600 ~/.gnupg/passphrase
          printf 'batch\npinentry-mode loopback\npassphrase-file %s\n' "$HOME/.gnupg/passphrase" > ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Build, sign and upload
        env:
          DEBSIGN_KEYID: ${{ secrets.GPG_KEY_ID }}
        run: sh scripts/ppa.sh "${{ matrix.series }}" ppa:saint-duckworth/ppa 1
